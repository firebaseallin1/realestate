# Builds the Flutter web app and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# The app calls the Render backend (see lib/core/api/api_client.dart), and
# Render's CORS_ORIGINS must include https://<user>.github.io.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'render.yaml'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # A project site lives at https://<user>.github.io/<repo>/, so the app
      # must load its files from /<repo>/. A <user>.github.io repo lives at /.
      - name: Work out base href
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [ "$repo" = "${{ github.repository_owner }}.github.io" ]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter build web --release --base-href "${{ steps.base.outputs.href }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
